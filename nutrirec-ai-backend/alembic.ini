# alembic.ini
# Konfigurasi Alembic untuk NutriRec AI.
# URL database dibaca dari variabel lingkungan di env.py, bukan dari sini.

[alembic]
# Direktori skrip migrasi
script_location = alembic

# Template penamaan file revisi
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Zona waktu untuk timestamp
timezone = Asia/Jakarta

# Jangan ubah nilai ini
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

